services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
    volumes:
      - db_data:/var/lib/mysql
  wordpress:
    image: wordpress:latest
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
    # WP-CLI lives outside wp_data (in the container's root filesystem), so it does
    # not survive container recreation on its own. Installing it here makes every
    # recreation (docker compose up -d / --build) self-healing — Hermes's wpcli()
    # docker-exec's into this container expecting `wp` at /usr/local/bin/wp.
    command: >
      bash -c "
        [ -x /usr/local/bin/wp ] || (curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar &&
        mv wp-cli.phar /usr/local/bin/wp &&
        chmod +x /usr/local/bin/wp) &&
        docker-entrypoint.sh apache2-foreground
      "
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - wordpress
  hermes:
    build: ./hermes
    restart: always
    depends_on:
      - wordpress
    environment:
      TELEGRAM_TOKEN:           ${TELEGRAM_TOKEN}
      ALLOWED_TELEGRAM_USER_ID: ${ALLOWED_TELEGRAM_USER_ID}
      OLLAMA_URL:               http://host.docker.internal:11434
      OLLAMA_MODEL:             mistral-small
      WP_INTERNAL_URL:          http://wordpress
      WP_USER:                  ${WP_USER}
      WP_APP_PASSWORD:          ${WP_APP_PASSWORD}
      WP_CONTAINER:             mohelal-wordpress-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hermes_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mohelal/tensoredge-publisher:/home/mohelal/tensoredge-publisher
volumes:
  db_data:
  wp_data:
  hermes_logs:
